# =============================================================================
# Deploy Backend → Render
#
# Triggered on every push to master that touches Backend-portfolio/.
# Steps:
#   1. Install deps — validates package-lock integrity
#   2. Trigger the Render deploy hook via HTTP POST
#
# Required GitHub secrets:
#   RENDER_DEPLOY_HOOK_BACKEND  — your Render service's deploy hook URL
#                                 (Render dashboard → service → Settings →
#                                  Deploy hook)
# =============================================================================

name: Deploy Backend to Render

on:
  push:
    branches: [master]
    paths:
      - "Backend-portfolio/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend-portfolio

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend-portfolio/package-lock.json

      # ── 3. Install dependencies (validates package-lock) ──────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Trigger Render deploy ──────────────────────────────────────────
      - name: Trigger Render deploy
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}" \
            -o /dev/null -w "HTTP status: %{http_code}\n"
